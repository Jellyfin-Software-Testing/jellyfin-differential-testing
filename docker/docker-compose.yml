services:
  jellyfin-v108:
    image: jellyfin/jellyfin:10.8.13
    container_name: jellyfin-v10.8.13-test
    restart: unless-stopped
    ports:
      - "8096:8096"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - LC_ALL=en_US.UTF-8
      - LANG=en_US.UTF-8
      - JELLYFIN_PublishedServerUrl=http://localhost:8096
    volumes:
      - ./v10.8/config:/config
      - ./v10.8/cache:/cache
      # Cả hai phiên bản phải đọc đúng một seed dataset bất biến.
      - ../data/seed-data:/media:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  jellyfin-v109:
    image: jellyfin/jellyfin:10.9.0
    container_name: jellyfin-v10.9.0-test
    restart: unless-stopped
    ports:
      - "8097:8096"  
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - LC_ALL=en_US.UTF-8
      - LANG=en_US.UTF-8
      - JELLYFIN_PublishedServerUrl=http://localhost:8097
    volumes:
      - ./v10.9/config:/config
      - ./v10.9/cache:/cache
      - ../data/seed-data:/media:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"] 
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped