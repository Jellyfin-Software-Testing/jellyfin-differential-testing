[pytest]
pythonpath = .

# Cấu hình tham số dòng lệnh mặc định
addopts = 
    --verbose
    -n auto
    --dist loadscope

# Đăng ký custom markers (tránh cảnh báo PytestUnknownMarkWarning)
markers =
    serial: Đánh dấu các test case bắt buộc phải chạy tuần tự (không chạy song song)
    items_basic_query: G2-11 basic GET /Items differential tests